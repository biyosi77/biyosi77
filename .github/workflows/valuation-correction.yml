name: Correct invalid 15:00 valuation report

on:
  push:
    branches: [feat/valuation-1500-20261030]
    paths: [.github/workflows/valuation-correction.yml]

permissions:
  contents: read

jobs:
  correct:
    if: github.event.head_commit.message == 'Issue 15:00 correction'
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
    steps:
      - name: Mark old document invalid and post correction
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat = os.environ['TELEGRAM_CHAT_ID']
          if chat != '@biyosi77':
              raise SystemExit('Unexpected channel')

          def call(method, data):
              body = urllib.parse.urlencode(data).encode()
              request = urllib.request.Request(
                  'https://api.telegram.org/bot' + token + '/' + method,
                  data=body, method='POST')
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              if not result.get('ok'):
                  raise RuntimeError('Telegram correction rejected')
              return result['result']

          correction = ('[정정·사용금지] 2026-10-30 15:00 밸류에이션 파일은 15:00 분봉 기준이 아닙니다. '
                        '133종목 중 12종목만 11:24~11:30 분봉이 기록됐고 121종목은 미확인입니다. '
                        '이 파일을 사용하지 마세요. 15:00 KRX 분봉을 재조회해 수정본을 게시하겠습니다.')
          call('editMessageCaption', {'chat_id': chat, 'message_id': 175,
                                      'caption': correction})
          message = call('sendMessage', {'chat_id': chat, 'text': correction})
          print('Correction posted, message ID:', message['message_id'])
          PY
