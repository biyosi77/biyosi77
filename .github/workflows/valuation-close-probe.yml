name: Temporary valuation close source probe

on:
  push:
    branches: [fix/valuation-schedule-20261020]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r valuation/requirements.txt
      - name: Compare one exact-date KRX close with KIS KRX daily close
        run: python -c "from datetime import date; from valuation.api import MarketData; c=MarketData(); d=date(2026,10,19); k=c.closes(d)['005930'][0]; x=c.daily_close('005930',d); print({'code':'005930','day':d.isoformat(),'krx':k,'kis_krx':x,'matched':k==x}); assert k==x"
