name: Weekend 2-Page Chesley Deep Study Report

on:
  schedule:
    # 매주 일요일 한국시간(KST) 오전 10:00 실행 (UTC 01:00)
    # 토요일 체슬리TV 별주부전(3.5~4시간) 풀영상 심층 분석 발송
    - cron: '0 1 * * 0'
  workflow_dispatch:

jobs:
  run-weekend-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Korean Fonts for PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekend 2-Page Report Generator
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --weekend
