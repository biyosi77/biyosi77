name: Market flow API schema probe

on:
  pull_request:
    paths:
      - 'market_flow/**'
      - '.github/workflows/market-flow-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      PROBE_DATE: '2026-11-04'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Probe market data schemas
        run: python -m market_flow.probe
      - name: Upload sanitized schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-flow-schema-${{ github.run_id }}
          path: market-flow-probe.json
          if-no-files-found: ignore
          retention-days: 3

