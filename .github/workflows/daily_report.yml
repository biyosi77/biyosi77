name: Daily 5-Page Investment Master Report

on:
  schedule:
    # 매일 평일(월~금) 한국시간(KST) 오전 10:30 실행 (UTC 01:30)
    # 빅머니(08:00) + 삼프로 4대 코너 + 체슬리 모닝브리프(07:30~09:15) 수집 후 발송
    - cron: '30 1 * * 1-5'
  workflow_dispatch:

jobs:
  run-daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Korean Fonts for PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily 5-Page Report Generator
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --daily
