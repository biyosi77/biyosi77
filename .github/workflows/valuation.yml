name: KRX 2027 valuation

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'KRX 거래일 YYYY-MM-DD (비우면 오늘 KST)'
        required: false
        type: string
      slot:
        description: '가격 회차'
        required: true
        default: '1130'
        type: choice
        options: ['1130', 'close']
      dry_run:
        description: '전송 없는 파일 생성·검증'
        required: true
        default: true
        type: boolean
      test_send:
        description: '전송 문구에 테스트 표시'
        required: true
        default: true
        type: boolean
      resend:
        description: '이미 전송/불확실 회차를 명시적으로 재전송'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

# The durable ledger also guards reruns; serialization covers concurrent jobs.
concurrency:
  group: krx-valuation-delivery
  cancel-in-progress: false

jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      TRADE_DATE: ${{ inputs.trade_date }}
      SLOT: ${{ inputs.slot }}
      DRY_RUN: ${{ inputs.dry_run }}
      TEST_SEND: ${{ inputs.test_send }}
      RESEND: ${{ inputs.resend }}
      OUTPUT_DIR: valuation-output
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: valuation/requirements.txt
      - name: Install valuation dependencies
        run: pip install -r valuation/requirements.txt
      - name: Core tests
        run: python -m pytest valuation/tests -q
      - name: Build, validate, and optionally send
        run: python -m valuation.run
      - name: Preserve report and sanitized log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: valuation-output/
          if-no-files-found: ignore
          retention-days: ${{ vars.VALUATION_ARTIFACT_DAYS || 30 }}
